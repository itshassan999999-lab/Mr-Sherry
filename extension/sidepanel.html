<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Reply Assistant</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <iframe id="app" title="Reply Assistant" allow="clipboard-write" hidden></iframe>
  <div id="waking" class="offline" hidden>
    <img src="icons/48.png" alt="" width="40" height="40">
    <h1>Waking up the assistant…</h1>
    <p>It sleeps when nobody has used it for a while. This takes up to a minute, then it's quick.</p>
  </div>
  <div id="offline" class="offline" hidden>
    <img src="icons/48.png" alt="" width="40" height="40">
    <h1>Can't reach the assistant server</h1>
    <p id="offlineDetail"></p>
    <ol>
      <li>Check your internet connection. If the server was just updated, wait a minute and try again.</li>
      <li>Check the server address in Settings.</li>
    </ol>
    <div class="row">
      <button id="retry" class="primary">Try again</button>
      <button id="openSettings">Settings</button>
    </div>
  </div>
  <script src="settings.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
