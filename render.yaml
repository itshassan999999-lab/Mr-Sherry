# One-click hosting on Render (https://render.com). Every push to main redeploys automatically.
# Free setup: Render's free plan + Groq's free API. Render asks for GROQ_API_KEY when you
# create the service; ACCESS_TOKEN is generated for you.
services:
  - type: web
    name: mr-sherry-assistant
    runtime: node
    plan: free               # $0; sleeps after 15 idle minutes, first click then takes ~1 min. "starter" = always on
    buildCommand: cd server && npm ci
    startCommand: cd server && node --max-old-space-size=320 src/server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: 0.0.0.0
      # groq = free. Add GEMINI_API_KEY and set "groq,gemini" to fall back when Groq's free limit is hit.
      - key: PROVIDER
        value: groq
      - key: ACCESS_TOKEN
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
