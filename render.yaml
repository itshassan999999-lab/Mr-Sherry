# One-click hosting on Render (https://render.com). Every push to main redeploys automatically.
# Free setup: Render's free plan + Google Gemini's free tier, with Groq's free tier as automatic
# backup. Render asks for GEMINI_API_KEY (and optionally GROQ_API_KEY); ACCESS_TOKEN is generated.
services:
  - type: web
    name: mr-sherry-assistant
    runtime: node
    plan: free               # $0; sleeps after 15 idle minutes, first click then takes ~1 min. "starter" = always on
    buildCommand: cd server && npm ci
    startCommand: cd server && node --max-old-space-size=320 src/server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: 0.0.0.0
      # Gemini first; Groq is used when Gemini's free limit is hit (skipped if no Groq key).
      - key: PROVIDER
        value: gemini,groq
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: ACCESS_TOKEN
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
